<section class="shop-entry shop-order">
  <!-- 访问令牌失效：通过邮箱重新获取访问链接 -->
  <div class="shop-card shop-order-locked" th:if="${locked}">
    <h1 class="shop-card__title">查看订单</h1>
    <p class="shop-order-locked__desc">
      订单链接已失效。填写下单时使用的邮箱，我们会发送一封新的访问邮件。
    </p>
    <p class="shop-order-locked__sent" th:if="${param.sent != null && !param.sent.empty}">
      如果邮箱与订单一致，新的访问链接已发送，请查收邮件。
    </p>
    <form
      class="shop-order-locked__form"
      th:action="|/shop/order/${orderCode}/access-link|"
      method="post"
    >
      <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
      <div class="shop-form-group">
        <label class="shop-label" for="order-access-email">邮箱</label>
        <input
          class="shop-input"
          id="order-access-email"
          type="email"
          name="email"
          required
          autocomplete="email"
          placeholder="下单时填写的邮箱"
        />
      </div>
      <button type="submit" class="shop-btn shop-btn-primary">发送访问链接</button>
    </form>
  </div>

  <div class="shop-order__grid" th:unless="${locked}">
    <div class="shop-order__main">
      <!-- 订单头 -->
      <div class="shop-card shop-order-header">
        <div class="shop-order-header__top">
          <div class="shop-order-header__meta">
            <h1 class="shop-order-header__code" th:text="|订单 #${order.orderCode}|">订单</h1>
            <p
              class="shop-order-header__date"
              th:if="${order.createdAt != null}"
              th:text="|下单时间：${#strings.replace(#strings.substring(order.createdAt, 0, 16), 'T', ' ')}|"
            ></p>
          </div>
          <div class="shop-order-header__badges">
            <span
              class="shop-order-badge shop-order-badge--success"
              th:if="${order.paymentStatus.name() == 'PAID'}"
              >已支付</span
            >
            <span
              class="shop-order-badge shop-order-badge--warning"
              th:if="${order.paymentStatus.name() == 'PENDING'}"
              >待支付</span
            >
            <span class="shop-order-badge" th:if="${order.paymentStatus.name() == 'AUTHORIZING'}"
              >支付确认中</span
            >
            <span class="shop-order-badge" th:if="${order.paymentStatus.name() == 'REFUNDED'}"
              >已退款</span
            >
            <span
              class="shop-order-badge shop-order-badge--danger"
              th:if="${order.paymentStatus.name() == 'FAILED'}"
              >支付失败</span
            >
            <span class="shop-order-badge" th:if="${order.paymentStatus.name() == 'EXPIRED'}"
              >支付已过期</span
            >
            <span class="shop-order-badge" th:if="${order.status.name() == 'CANCELLED'}"
              >已取消</span
            >
            <span
              class="shop-order-badge shop-order-badge--success"
              th:if="${order.status.name() == 'ARCHIVED'}"
              >已完成</span
            >
            <span
              class="shop-order-badge shop-order-badge--warning"
              th:if="${order.refundStatus != null && order.refundStatus.name() == 'PARTIAL'}"
              >部分退款</span
            >
            <span
              class="shop-order-badge shop-order-badge--warning"
              th:if="${order.refundStatus != null && order.refundStatus.name() == 'FULL'}"
              >已全额退款</span
            >
          </div>
        </div>

        <div class="shop-order-header__amount">
          <span class="shop-order-header__amount-label">应付金额</span>
          <span
            class="shop-order-header__amount-value"
            th:text="|¥${#numbers.formatDecimal(order.payableAmount, 1, 2)}|"
          ></span>
        </div>

        <p class="shop-order-header__notes" th:if="${order.customerNotes != null}">
          备注：<span th:text="${order.customerNotes}"></span>
        </p>

        <div class="shop-order-header__actions">
          <a
            class="shop-btn shop-btn-primary"
            th:if="${canPay}"
            th:href="|/shop/order/${order.orderCode}/payments|"
            >去支付</a
          >
          <a
            class="shop-btn shop-btn-secondary"
            th:if="${authenticated}"
            th:href="|/uc/shop/orders/${order.orderCode}|"
            >在个人中心查看</a
          >
          <form
            th:if="${canCancel}"
            th:action="|/shop/order/${order.orderCode}/cancel|"
            method="post"
            onsubmit="return confirm('确定取消这笔未支付的订单吗？');"
          >
            <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
            <button type="submit" class="shop-btn shop-btn-secondary shop-order__cancel-btn">
              取消订单
            </button>
          </form>
        </div>
      </div>

      <!-- 商品清单 -->
      <div class="shop-card">
        <h2 class="shop-card__title">商品清单</h2>
        <div class="shop-order-items">
          <div class="shop-order-item" th:each="item : ${order.items}">
            <img
              class="shop-order-item__image"
              th:if="${item.itemImageUrl != null}"
              th:src="${item.itemImageUrl}"
              th:alt="${item.itemTitle}"
            />
            <div
              class="shop-order-item__image shop-order-item__image--placeholder"
              th:if="${item.itemImageUrl == null}"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                <circle cx="9" cy="9" r="2"></circle>
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
              </svg>
            </div>
            <div class="shop-order-item__info">
              <a
                class="shop-order-item__name"
                th:if="${item.permalink != null}"
                th:href="${item.permalink}"
                th:text="${item.itemTitle}"
              ></a>
              <span
                class="shop-order-item__name"
                th:if="${item.permalink == null}"
                th:text="${item.itemTitle}"
              ></span>
              <span class="shop-product-card__badge" th:if="${item.subscriptionMetadata != null}">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                  <path d="M21 3v5h-5"></path>
                  <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                  <path d="M8 16H3v5"></path>
                </svg>
                <span>订阅</span>
              </span>
              <span
                class="shop-order-item__quantity"
                th:text="|¥${#numbers.formatDecimal(item.unitPrice, 1, 2)} × ${item.quantity}|"
              ></span>
            </div>
            <span
              class="shop-order-item__price"
              th:text="|¥${#numbers.formatDecimal(item.subtotal, 1, 2)}|"
            ></span>
          </div>
        </div>
      </div>

      <!-- 履约信息 -->
      <div class="shop-card" th:each="fulfillment : ${fulfillments}">
        <div class="shop-order-fulfillment__head">
          <h2 class="shop-card__title">
            <span th:if="${fulfillment.type.name() == 'SHIPPING'}">快递发货</span>
            <span th:if="${fulfillment.type.name() == 'PICKUP'}">门店自提</span>
            <span th:if="${fulfillment.type.name() == 'LOCAL_DELIVERY'}">同城配送</span>
            <span th:if="${fulfillment.type.name() == 'VIRTUAL'}">虚拟交付</span>
          </h2>
          <span
            class="shop-order-badge"
            th:if="${fulfillment.status != null}"
            th:classappend="|shop-order-badge--${fulfillment.status.name() == 'COMPLETED' ? 'success' : (fulfillment.status.name() == 'FAILED' || fulfillment.status.name() == 'CANCELLED' ? 'danger' : 'neutral')}|"
            th:text="${fulfillment.status.name() == 'PENDING' ? '待履约' : (fulfillment.status.name() == 'READY' ? '待处理' : (fulfillment.status.name() == 'PROCESSING' ? '履约中' : (fulfillment.status.name() == 'SHIPPED' ? '已发货' : (fulfillment.status.name() == 'COMPLETED' ? '已完成' : (fulfillment.status.name() == 'FAILED' ? '履约失败' : '已取消')))))}"
          ></span>
        </div>

        <div class="shop-order-fulfillment__labels" th:if="${!#lists.isEmpty(fulfillment.labels)}">
          <div class="shop-order-fulfillment__label" th:each="label : ${fulfillment.labels}">
            <span class="shop-order-fulfillment__carrier" th:text="${label.carrier}">承运商</span>
            <a
              class="shop-order-fulfillment__tracking"
              th:if="${label.trackingUrl != null}"
              th:href="${label.trackingUrl}"
              target="_blank"
              rel="noopener noreferrer"
              th:text="${label.trackingNumber}"
            ></a>
            <span
              class="shop-order-fulfillment__tracking"
              th:if="${label.trackingUrl == null}"
              th:text="${label.trackingNumber}"
            ></span>
          </div>
        </div>

        <div class="shop-order-fulfillment__items">
          <div class="shop-order-fulfillment__item" th:each="item : ${fulfillment.items}">
            <p
              class="shop-order-fulfillment__item-title"
              th:if="${item.orderItem != null}"
              th:text="${item.orderItem.itemTitle}"
            ></p>
            <p
              class="shop-order-fulfillment__instructions"
              th:if="${item.instructions != null}"
              th:text="${item.instructions}"
            ></p>
            <div
              class="shop-order-fulfillment__resources"
              th:if="${item.digitalResources != null}"
              th:each="resource : ${item.digitalResources}"
            >
              <a
                class="shop-order-fulfillment__resource"
                th:if="${resource.resourceType.name() == 'STATIC_URL'}"
                th:href="${resource.resourceUrl}"
                target="_blank"
                rel="noopener noreferrer"
                th:text="${resource.resourceName}"
              ></a>
              <a
                class="shop-order-fulfillment__resource"
                th:if="${resource.resourceType.name() == 'ATTACHMENT'}"
                th:href="|/shop/order/${order.orderCode}/digital-resources/${resource.publicId}/download|"
                th:text="${resource.resourceName}"
              ></a>
            </div>
            <div
              class="shop-order-fulfillment__cdk"
              th:if="${item.cdks != null}"
              th:each="cdk : ${item.cdks}"
            >
              <span class="shop-order-fulfillment__cdk-label">卡密</span>
              <code class="shop-order-fulfillment__cdk-code" th:text="${cdk.code}"></code>
              <code
                class="shop-order-fulfillment__cdk-secret"
                th:if="${cdk.secret != null}"
                th:text="${cdk.secret}"
              ></code>
            </div>
          </div>
        </div>
      </div>

      <!-- 收货地址 -->
      <div class="shop-card" th:if="${order.shippingAddress != null}">
        <h2 class="shop-card__title">收货地址</h2>
        <p
          class="shop-order-address__line"
          th:text="|${order.shippingAddress.province ?: ''} ${order.shippingAddress.city ?: ''} ${order.shippingAddress.district ?: ''} ${order.shippingAddress.streetAddress ?: ''}|"
        ></p>
        <p
          class="shop-order-address__contact"
          th:text="|${order.shippingAddress.lastName ?: ''}${order.shippingAddress.firstName ?: ''}　${order.shippingAddress.contactPhone ?: ''}|"
        ></p>
      </div>
    </div>

    <!-- 费用汇总 -->
    <aside class="shop-order__aside">
      <div class="shop-card shop-order-summary-card">
        <h2 class="shop-card__title">费用汇总</h2>
        <div class="shop-order-summary__row" th:if="${order.subtotalAmount != null}">
          <span>商品小计</span>
          <span th:text="|¥${#numbers.formatDecimal(order.subtotalAmount, 1, 2)}|"></span>
        </div>
        <div class="shop-order-summary__row" th:if="${order.shippingAmount != null}">
          <span>运费</span>
          <span th:text="|¥${#numbers.formatDecimal(order.shippingAmount, 1, 2)}|"></span>
        </div>
        <div
          class="shop-order-summary__row shop-order-summary__row--discount"
          th:if="${order.discountAmount != null && order.discountAmount > 0}"
        >
          <span
            th:text="${order.discountName != null ? '优惠（' + order.discountName + '）' : '优惠'}"
          ></span>
          <span th:text="|-¥${#numbers.formatDecimal(order.discountAmount, 1, 2)}|"></span>
        </div>
        <div class="shop-divider"></div>
        <div class="shop-order-summary__row shop-order-summary__row--total">
          <span>应付总额</span>
          <span th:text="|¥${#numbers.formatDecimal(order.payableAmount, 1, 2)}|"></span>
        </div>
        <div
          class="shop-order-summary__row"
          th:if="${order.paidAmount != null && order.paidAmount > 0}"
        >
          <span>实付金额</span>
          <span th:text="|¥${#numbers.formatDecimal(order.paidAmount, 1, 2)}|"></span>
        </div>
      </div>
    </aside>
  </div>
</section>
