<div class="shop-entry">
  <div class="shop-product-detail">
    <div th:if="${!#lists.isEmpty(product.images)}" class="shop-product-gallery">
      <swiper-container
        class="product-gallery-swiper"
        thumbs-swiper=".product-gallery-nav-swiper"
        navigation="true"
      >
        <swiper-slide th:each="image : ${product.images}">
          <img th:src="${image}" alt="Product Image" data-zoomable />
        </swiper-slide>
      </swiper-container>
      <swiper-container
        class="product-gallery-nav-swiper"
        space-between="10"
        slides-per-view="auto"
        free-mode="true"
        watch-slides-progress="true"
      >
        <swiper-slide th:each="image : ${product.images}">
          <img th:src="${image}" sizes="100px" alt="Product Image" />
        </swiper-slide>
      </swiper-container>
    </div>
    <div
      th:if="${#lists.isEmpty(product.images)}"
      class="shop-product-gallery shop-product-gallery--empty"
    >
      <div class="shop-product-gallery__placeholder">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <circle cx="9" cy="9" r="2"></circle>
          <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
        </svg>
      </div>
    </div>

    <div class="shop-product-info">
      <h1 class="shop-product-info__title" th:text="${product.title}"></h1>
      <p class="shop-product-info__desc" th:text="${product.description}"></p>
      <shop-buy-box th:id="${product.id}" th:csrfToken="${_csrf.token}"></shop-buy-box>
    </div>
  </div>

  <div class="shop-product-content">
    <section class="shop-product-content__section" th:if="${!#strings.isEmpty(product.content)}">
      <h2 class="shop-product-content__heading">商品详情</h2>
      <div class="shop-product-content__description" th:utext="${product.content}"></div>
    </section>

    <section
      class="shop-product-content__section"
      th:if="${(product.productType == null or product.productType.toString() != 'SUBSCRIPTION') and !#lists.isEmpty(product.specDefinition)}"
    >
      <h2 class="shop-product-content__heading">规格参数</h2>
      <table class="shop-product-content__specs">
        <tbody>
          <tr th:each="spec : ${product.specDefinition}">
            <td th:text="${spec.name}"></td>
            <td>
              <span
                th:each="specValue, iterStat : ${spec.values}"
                th:text="${specValue.value} + ${iterStat.last ? '' : ', '}"
              ></span>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>
</div>
